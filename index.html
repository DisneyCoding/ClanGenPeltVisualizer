<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClanGen Pelt Visualizer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <div>
        <h1>ClanGen Pelt Visualizer</h1>
        <p>Preview ClanGen pelts by making your own patterns and customizing their colors!!</p>
      </div>
      <div id="status" class="status">Loading assets...</div>
    </header>

    <section class="workspace">
      <section class="preview-panel panel">
        <div class="panel-heading"><h2>Preview</h2></div>
        <div class="preview-wrap"><canvas id="preview" width="50" height="50"></canvas></div>
        <label>Pose<select id="poseSelect"></select></label>
        <div class="button-row">
          <button id="randomizeBtn">Randomize</button>
          <button id="resetBtn">Reset</button>
        </div>
        <div class="button-row">
          <button id="downloadBtn">Download PNG</button>
          <button id="saveBtn">Save Pelt</button>
          <label class="button file-button">Load Pelt<input id="loadInput" type="file" accept="application/json,.json"></label>
        </div>
      </section>
      <section class="controls">
        <div class="section">
          <div class="section-title">
            <h2>Colors</h2>
          </div>
          <div id="colorControls" class="color-controls"></div>
        </div>

        <div class="section">
          <div class="section-title">
            <h2>Layers</h2>
            <button id="addLayerBtn">+ Add pattern</button>
          </div>
          <div id="layers" class="layers"></div>
        </div>

        <div class="section add-pattern">
          <div class="section-title">
            <h2>Add Pattern</h2>
          </div>

          <label>
            Pattern
            <select id="patternSelect"></select>
          </label>

          <label>
            Color
            <select id="newLayerCategory"></select>
          </label>

          <button id="confirmAddBtn">
            Add Pattern
          </button>
        </div>
      </section>
    </section>
  </main>
  <script type="module" src="script.js"></script>
</body>
</html>
